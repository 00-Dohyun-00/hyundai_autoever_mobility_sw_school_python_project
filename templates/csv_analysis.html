{% extends "base.html" %}

{% block title %}사출 불량 예측 분석 - 사출 데이터 대시보드{% endblock %}

{% block content %}
<section>
  <h2>사출 불량 예측 분석</h2>

  <div id="analysis-content" class="loading">
    <div class="spinner"></div>
    <p><strong>{{ csv_name }}</strong> 파일 분석중...</p>
    <p style="font-size: 0.85rem;">모델을 학습하는 중입니다. 잠시만 기다려주세요.</p>
  </div>
</section>

<script>
  fetch("{{ url_for('analysis_content') }}")
    .then((res) => res.text())
    .then((html) => {
      document.getElementById("analysis-content").outerHTML = html;
    })
    .catch(() => {
      document.getElementById("analysis-content").innerHTML =
        '<p class="error">분석 중 오류가 발생했습니다.</p>';
    });
</script>
{% endblock %}
